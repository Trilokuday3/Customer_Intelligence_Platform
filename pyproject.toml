[project]
name = "customer-intelligence"
version = "0.1.0"
description = "Customer Intelligence Platform: churn, CLV, segmentation, and retention analytics"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.7",
    "faker>=25.0",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
stats = [
    "scipy>=1.13",
    "statsmodels>=0.14",
]
ml = [
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "shap>=0.45",
    "lifetimes>=0.11",
]
# Pinned to the minor versions the baked deploy/models/*.joblib were trained
# with: a pickled model is only guaranteed to load on the same minor version.
serve = [
    "scikit-learn>=1.9,<1.10",
    "xgboost>=3.2,<3.3",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "joblib>=1.4",
]
mlops = [
    "mlflow>=2.13",
]
streaming = [
    "kafka-python>=2.0.3",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
